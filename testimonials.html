<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonials | Neman Family Dentistry</title>
    <meta
      name="description"
      content="See what patients say about Neman Family Dentistry in Great Neck and Forest Hills, NY."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230d0f0e'/%3E%3Cpath d='M24 11c-4 6-6 9-6 14a6 6 0 0 0 12 0c0-5-2-8-6-14Z' fill='%23d8b36e'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="testimonials">
    <div id="header-mount"></div>

    <main>
      <section class="page-hero">
        <div class="wrap">
          <span class="kicker" data-content="testimonials.kicker"></span>
          <h1 data-content="testimonials.heading"></h1>
          <p data-content="testimonials.subhead"></p>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="grid grid-2" data-render="testimonials"></div>
        </div>
      </section>

      <section class="section" style="padding-top: 0">
        <div class="wrap">
          <div class="band reveal">
            <h2 data-content="tagline"></h2>
            <p data-content="footer.blurb"></p>
            <a class="btn" href="#book" data-book>
              <span data-content="cta.bookLong"></span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-mount"></div>
    <script src="content.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
